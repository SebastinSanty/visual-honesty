name: Deploy Database Migrations

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Project
        run: |
          # This shell script grabs the ID between 'https://' and '.supabase.co'
          PROJECT_REF=$(echo "${{ secrets.VITE_SUPABASE_URL }}" | sed -e 's/https:\/\///' -e 's/\.supabase\.co//')
          
          supabase link --project-ref "$PROJECT_REF" -p ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy Migrations
        # This pushes only the .sql files in your /migrations folder
        run: supabase db push -p ${{ secrets.SUPABASE_DB_PASSWORD }}
